<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/logo/wings-logo-512.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/logo/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/logo/favicon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fonts load async so a slow font CDN never blocks first paint;
       text renders immediately with the fallback stack. -->
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="bg-cream-50 font-body text-ink-900 antialiased">
  <a href="#main" class="skip-link">Skip to main content</a>
  {{> header}}
  <main id="main">
{{content}}
  </main>
  {{> footer}}
  <script src="assets/js/main.js" defer></script>
</body>
</html>
